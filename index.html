<style>
    body { margin: 0; font-family: sans-serif; background: #080d16; color: #e2e8f0; display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; overflow: hidden; overscroll-behavior: none;}

    #display {

.startBtn {

}
    .status-connected { color: #22c55e; border: 1px solid #22c55e; }

#slaveLabel {

}
#cueInfo {

#cueTimeRow {

#cueTargetTime {

}

.cueClearBtn {
    height: 50px !important;
    padding: 4px;
    font-size: 18px !important;
    font-weight: 900;
}
    .cueButtons {
    display: grid;
    grid-template-columns: repeat(3, 86.67px) 120px;

.cueButtons .eventBtn {
    height: 50px !important;

.cueButtons .cueClearBtn {
    height: 50px !important;

</div>

<div class="container">

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
    const role = new URLSearchParams(window.location.search).get('role');
    window.addEventListener('DOMContentLoaded', () => {

    if (role === 'cue') {

        document.getElementById('slaveLabel').innerText =
            'REAL TIME / TIMER';

    }

});
   if (role === 'master') {
    const display = document.getElementById('display');
    const status = document.getElementById('status');
       document.querySelector('button[onclick="location.reload()"]').style.display = 'none';

   const container = document.querySelector('.container');

function autoScale() {

    container.style.transform = 'scale(1)';

    const rect = container.getBoundingClientRect();

    const scaleX = (window.innerWidth * 0.92) / rect.width;
    const scaleY = (window.innerHeight * 0.92) / rect.height;

    const scale = Math.min(scaleX, scaleY);

    container.style.transform = `scale(${scale})`;
}

window.addEventListener('load', autoScale);
window.addEventListener('resize', autoScale);

setTimeout(autoScale, 100);
    status.style.position = 'static';
    status.style.width = '120px';
    status.style.display = 'block';
    status.style.margin = '4px auto 12px';
    status.style.padding = '2px 6px';

    display.style.fontSize = '7rem';
    display.style.padding = '16px 20px';
    display.style.border = '3px solid #FFFFFF';

    const digits = document.querySelectorAll('.digit');
    digits.forEach(d => {
        d.style.width = '50px';
        d.style.margin = '0 5px';
    });

    document.querySelectorAll('.separator').forEach(s => {
        s.style.width = '28px';
    });
}
    const MASTER_ID = 'radio-secret-id-Zyxw-Vuts-9821-Kjhl'; 
    const peer = new Peer(role === 'master' ? MASTER_ID : null);
    
    let conns = [];
let conn, time = 0, timer = null, inputBuffer = "";
    let seq = 0;
    let startTime = 0;
let savedBuffer = "";
let editing = false;
    let wakeLock = null;
    let slaveTime = null;
    let lastBlinkSecond = -1;
    let cueTargetTime = null;
function updateConnDot() {

    if (!conn || !conn.peerConnection) return;

    conn.peerConnection.getStats().then(stats => {
        stats.forEach(r => {

            if (r.type === 'candidate-pair' && r.state === 'succeeded') {

                const dot = document.getElementById('connDot');

                if (r.localCandidateType === 'relay') {
                    dot.style.color = "#facc15"; // 黄色
                } else {
                    dot.style.color = "#666"; // 白
                }

            }
        });
    });
}
    
    let ignoreDiffUntil = 0;

    // 操作エリアを表示する関数
    function showControls() {
    if (role === 'master') {
        document.getElementById('uiArea').style.display = 'block';

        setTimeout(autoScale, 50);
    }
}

   function press(n) {

    if (!editing) {
        inputBuffer = "";
        editing = true;
    }

    if (inputBuffer.length < 6) {
        inputBuffer += n;
        updatePreview();
    }
}
    function clearInput() {
    inputBuffer = "";
    savedBuffer = "";
    editing = false;
    updatePreview();
}
   function updatePreview() {

    const source =
        inputBuffer !== ""
            ? inputBuffer
            : savedBuffer;

    if (source === "") {
        document.getElementById('inputPreview').innerText = "--:--:--";
        return;
    }

    const d = source.padStart(6, '0');

    document.getElementById('inputPreview').innerText =
        d.slice(0,2) + ":" + d.slice(2,4) + ":" + d.slice(4,6);
}
function setCueCM() {

    if (inputBuffer.length === 0) return;

    const d = inputBuffer.padStart(6, '0');

    document.getElementById('cueMasterLabel').innerText = 'CM入り';

    document.getElementById('cueMasterTime').innerText =
        d.slice(0,2) + ':' +
        d.slice(2,4) + ':' +
        d.slice(4,6);

    sendToAll({
        type: 'cueCM',
        value: inputBuffer
    });
}
    function setCueSong() {

    if (inputBuffer.length === 0) return;

    const d = inputBuffer.padStart(6, '0');

    document.getElementById('cueMasterLabel').innerText = '曲入り';

    document.getElementById('cueMasterTime').innerText =
        d.slice(0,2) + ':' +
        d.slice(2,4) + ':' +
        d.slice(4,6);

    sendToAll({
        type: 'cueSong',
        value: inputBuffer
    });
}
    function setCueReturn() {

    if (inputBuffer.length === 0) return;

    const d = inputBuffer.padStart(6, '0');

    document.getElementById('cueMasterLabel').innerText = '戻り';

    document.getElementById('cueMasterTime').innerText =
        d.slice(0,2) + ':' +
        d.slice(2,4) + ':' +
        d.slice(4,6);

    sendToAll({
        type: 'cueReturn',
        value: inputBuffer
    });
}
    function clearCue() {

    document.getElementById('cueMasterLabel').innerText = '--';
    document.getElementById('cueMasterTime').innerText = '--:--:--';

    sendToAll({
        type: 'cueClear'
    });
}
    function setTimer() {
        if (timer) return;
        if(inputBuffer.length === 0) return;
        const total = parseInt(inputBuffer.padStart(6, '0'));
        const h = Math.floor(total / 10000);
        const m = Math.floor((total % 10000) / 100);
        const s = total % 100;
        time = h * 3600 + m * 60 + s;
        ignoreDiffUntil = Date.now() + 1000;
        updateDisplay();
        savedBuffer = inputBuffer;
editing = false;
updatePreview();
       sendToAll({type: 'time', value: time});
    }

  async function keepScreenAwake() {
    try {
        if ('wakeLock' in navigator) {
            wakeLock = await navigator.wakeLock.request('screen');
        }
    } catch (err) {
        console.log(err);
    }
}

function updateDisplay() {

    const h = Math.floor(time / 3600);
    const m = Math.floor((time % 3600) / 60);
    const s = time % 60;

    const txt =
        String(h).padStart(2,'0') +
        String(m).padStart(2,'0') +
        String(s).padStart(2,'0');

    const digits =
        document.querySelectorAll('#display .digit');

    for(let i=0;i<6;i++){
    digits[i].innerText = txt[i];
}

if (role === 'slave') {

    if (time !== lastBlinkSecond) {

        lastBlinkSecond = time;

        document.querySelectorAll('.separator').forEach(s => {

            s.style.opacity = '1';
            s.style.color = '#ff2222';
            s.style.textShadow =
                '0 0 8px rgba(255,0,0,0.9), 0 0 16px rgba(255,0,0,0.55)';
        });

        setTimeout(() => {

            document.querySelectorAll('.separator').forEach(s => {
                s.style.opacity = '0.2';
                s.style.textShadow = 'none';
            });

        }, 500);
    }
}

if (role === 'cue') {

    if (time !== lastBlinkSecond) {

        lastBlinkSecond = time;

        document.querySelectorAll('.separator').forEach(s => {

            s.style.opacity = '1';
            s.style.color = '#ff2222';
            s.style.textShadow =
                '0 0 8px rgba(255,0,0,0.9), 0 0 16px rgba(255,0,0,0.55)';
        });

        setTimeout(() => {

            document.querySelectorAll('.separator').forEach(s => {
                s.style.opacity = '0.2';
                s.style.textShadow = 'none';
            });

        }, 500);
    }
}

checkSlaveDiff();
}

    function toggleTimer() {

    const resetBtn = document.querySelector('.resetBtn');
    const setBtn = document.querySelector('.setBtn');

    if (timer) {
        clearInterval(timer);
        timer = null;

        // ボタンを元に戻す
        resetBtn.classList.remove('disabled');
        setBtn.classList.remove('disabled');

    } else {
        startTime = Date.now() - (time * 1000);

        timer = setInterval(() => {
            time = Math.floor((Date.now() - startTime) / 1000);
            updateDisplay();
           sendToAll({type: 'time', value: time, seq: seq++});

        }, 100);

        // ボタンを暗くする
        resetBtn.classList.add('disabled');
        setBtn.classList.add('disabled');
    }
}

    function checkSlaveDiff() {
if (Date.now() < ignoreDiffUntil) return;
    if (slaveTime === null) return;

    const diff = Math.abs(time - slaveTime);

    const alertEl = document.getElementById('slaveAlert');
    const timeEl  = document.getElementById('slaveTimeText');

    if (diff >= 3) {
        alertEl.style.color = "#ff3030";
        timeEl.style.color = "#ff3030";
    } else {
        alertEl.style.color = "#555";
        timeEl.style.color = "#666";
    }
}
    function resetTimer() { 
if (timer) return;
    clearInterval(timer);
    timer = null;
    time = 0;
        ignoreDiffUntil = Date.now() + 1000;
    startTime = Date.now();
    updateDisplay();

    setTimeout(() => {
        sendToAll({type: 'time', value: time});
    }, 50);
}


    const statusEl = document.getElementById('status');
    function sendToAll(data) {
    conns.forEach(c => {
        if (c.open) c.send(data);
    });
}
    function setStatus(text, className) { statusEl.innerText = text; statusEl.className = className; }

    function connectToMaster() {
        setStatus("CONNECTING...", "status-connecting");
        conn = peer.connect(MASTER_ID);
        conn.on('open', () => { setStatus("CONNECTED", "status-connected"); /* 子機は controls を表示しない */setTimeout(updateConnDot, 1000); });
       let lastUpdateTime = 0;
        let lastReceived = 0;

let lastSeq = -1;

conn.on('data', data => {

   if (data.type === 'cueCM') {
    const d = String(data.value).padStart(6, '0');

    const h = parseInt(d.slice(0,2));
    const m = parseInt(d.slice(2,4));
    const s = parseInt(d.slice(4,6));

    cueTargetTime = h * 3600 + m * 60 + s;
       document.getElementById('cueLabel').innerText = 'CM入り';
       document.getElementById('cueLabel').style.color = '#20E0D0';
document.getElementById('cueRemain').style.color = '#20E0D0';

    document.getElementById('cueTargetTime').innerText =
        d.slice(0,2) + ':' +
        d.slice(2,4) + ':' +
        d.slice(4,6);
}
    if (data.type === 'cueSong') {
    const d = String(data.value).padStart(6, '0');

    const h = parseInt(d.slice(0,2));
    const m = parseInt(d.slice(2,4));
    const s = parseInt(d.slice(4,6));

    cueTargetTime = h * 3600 + m * 60 + s;

    document.getElementById('cueLabel').innerText = '曲入り';
        document.getElementById('cueLabel').style.color = '#20E0D0';
document.getElementById('cueRemain').style.color = '#20E0D0';

    document.getElementById('cueTargetTime').innerText =
        d.slice(0,2) + ':' +
        d.slice(2,4) + ':' +
        d.slice(4,6);
}
    if (data.type === 'cueReturn') {
    const d = String(data.value).padStart(6, '0');

    const h = parseInt(d.slice(0,2));
    const m = parseInt(d.slice(2,4));
    const s = parseInt(d.slice(4,6));

    cueTargetTime = h * 3600 + m * 60 + s;

    document.getElementById('cueLabel').innerText = 'スタジオ戻り';
        document.getElementById('cueLabel').style.color = '#FFF02A';
document.getElementById('cueRemain').style.color = '#FFF02A';

    document.getElementById('cueTargetTime').innerText =
        d.slice(0,2) + ':' +
        d.slice(2,4) + ':' +
        d.slice(4,6);
}
if (data.type === 'cueClear') {
    console.log('CUE CLEAR RECEIVED');
    cueTargetTime = null;

    document.getElementById('cueLabel').innerText = '--';
    document.getElementById('cueTargetTime').innerText = '--:--:--';
    document.getElementById('cueRemain').innerText = '--:--';

    document.getElementById('cueLabel').style.color = '#64748B';
document.getElementById('cueTargetTime').style.color = '#64748B';
document.getElementById('cueRemain').style.color = '#64748B';
}
    if (data.type === 'time') {
    if (data.seq < lastSeq) return;
    lastSeq = data.seq;

    time = data.value;
    updateDisplay();

    if (cueTargetTime !== null) {
        const remain = cueTargetTime - time;

if (remain <= 0) {
    cueTargetTime = null;

    document.getElementById('cueTargetTime').innerText = '--:--:--';
    document.getElementById('cueRemain').innerText = '--:--';
} else {
    const minutes = Math.floor(remain / 60);
    const seconds = remain % 60;

    document.getElementById('cueRemain').innerText =
        String(minutes).padStart(2, '0') + ':' +
        String(seconds).padStart(2, '0');
}
    }

    if (conn) {
        conn.send({
            type: 'slaveTime',
            value: time
        });
    }
}
});
        conn.on('close', () => { setStatus("UNLINK", "status-unlink"); setTimeout(connectToMaster, 3000); });
    }

   peer.on('open', () => {
    if (role === 'slave') {
        const overlay = document.getElementById('tapToConnect');
        overlay.style.display = 'flex'; // ボタンを表示
        overlay.addEventListener('click', () => {
            overlay.style.display = 'none'; // ボタンを隠す
            connectToMaster();
        }, { once: true });
    }
});
    peer.on('open', () => {
    if (role === 'cue') {
        const overlay = document.getElementById('tapToConnect');
        overlay.style.display = 'flex';

        overlay.addEventListener('click', () => {
            overlay.style.display = 'none';
            connectToMaster();
        }, { once: true });
    }
});
    peer.on('connection', c => {
    conn = c;
    conns.push(c);
c.on('close', () => {
    conns = conns.filter(x => x !== c);
});
    showControls();
    setStatus("CONNECTED", "status-connected");
        setTimeout(updateConnDot, 1000);

    c.on('data', data => {
        if(data.type === 'cueCM') {
    const d = String(data.value).padStart(6, '0');

    document.getElementById('cueTargetTime').innerText =
        d.slice(0,2) + ':' +
        d.slice(2,4) + ':' +
        d.slice(4,6);
}

        if(data.type === 'time') {
            time = data.value;
            updateDisplay();
        }

       if(data.type === 'slaveTime') {

    slaveTime = data.value;

    const h = Math.floor(slaveTime / 3600);
    const m = Math.floor((slaveTime % 3600) / 60);
    const s = slaveTime % 60;

    document.getElementById('slaveTimeText').innerText =
    String(h).padStart(2,'0') + ":" +
    String(m).padStart(2,'0') + ":" +
    String(s).padStart(2,'0');
        
}
    });
});
if (role === 'slave') {
    
    const displayGroup = document.getElementById('displayGroup');

    function autoScaleSlave() {

        displayGroup.style.transform =
            'rotate(90deg) scale(1)';

        const rect =
            displayGroup.getBoundingClientRect();

        const scaleX =
            (window.innerHeight * 0.88) / rect.width;

        const scaleY =
            (window.innerWidth * 0.88) / rect.height;

        const scale =
            Math.min(scaleX, scaleY);

        displayGroup.style.transform =
            `rotate(90deg) scale(${scale})`;
    }

    window.addEventListener('load', autoScaleSlave);
    window.addEventListener('resize', autoScaleSlave);

    setTimeout(autoScaleSlave, 100);

    displayGroup.style.transformOrigin = 'center center';
    displayGroup.style.display = 'flex';
    displayGroup.style.flexDirection = 'column';
    displayGroup.style.alignItems = 'center';
    document.querySelectorAll('.digit').forEach(d => {
d.style.margin = '0 12px';
});
document.querySelectorAll('.separator').forEach(s => {
    s.style.fontSize = '1.0em';   // お好みで 1.05em や 1.1em
    s.style.width = '52px';
    s.style.fontWeight = '900';
});

    
    const status = document.getElementById('status');
    status.style.position = 'static';

}
   if (role === 'cue') {

    const displayGroup = document.getElementById('displayGroup');
const display = document.getElementById('display');
       document.getElementById('cueInfo').style.display = 'block';

    displayGroup.style.transformOrigin = 'center center';
    displayGroup.style.display = 'flex';
    displayGroup.style.flexDirection = 'column';
    displayGroup.style.alignItems = 'center';

    display.style.marginLeft = 'auto';
    display.style.marginRight = 'auto';

    function autoScaleCue() {

        displayGroup.style.transform = 'scale(1)';

        const rect = displayGroup.getBoundingClientRect();

        const scaleX =
            (window.innerWidth * 0.88) / rect.width;

        const scaleY =
            (window.innerHeight * 0.88) / rect.height;

       const scale =
    Math.min(scaleX, scaleY) * 0.7;

displayGroup.style.transform =
    `scale(${scale})`;
    }

    window.addEventListener('load', autoScaleCue);
    window.addEventListener('resize', autoScaleCue);

    setTimeout(autoScaleCue, 100);

    document.querySelectorAll('.digit').forEach(d => {
        d.style.margin = '0 12px';
    });

    document.querySelectorAll('.separator').forEach(s => {
        s.style.fontSize = '1.0em';
        s.style.width = '52px';
        s.style.fontWeight = '900';
    });

    const status = document.getElementById('status');
    status.style.position = 'static';
    status.style.marginTop = '10px';
}
      document.addEventListener('pointerdown', () => {
    if (!wakeLock) keepScreenAwake();
}, { once: true });

document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
        keepScreenAwake();
    }
});
